# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

registries:
  nuget-org:
    type: nuget-feed
    url: https://api.nuget.org/v3/index.json

  bepinex:
    type: nuget-feed
    url: https://nuget.bepinex.dev/v3/index.json

  thunderstore-aaron:
    type: nuget-feed
    url: https://nuget.windows10ce.com/nuget/v3/index.json

updates:
  - package-ecosystem: "nuget" # See documentation for possible values
    directory: "/" # Location of package manifests

    # Keep all of them up to date
    registries: "*"

    # NEEDTOVALIDATE: How often should I have this check.......
    schedule:
      interval: "daily"

    # Apply the correct label
    labels:
      - "dependencies"

    open-pull-requests-limit: 5 # Lets be reasonable now

    # Don't handle BepInEx updates
    - dependency-name: "BepInEx.Core"
